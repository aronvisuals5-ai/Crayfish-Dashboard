<!DOCTYPE html>
<html>

<head>
    <title>Crayfish Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Firebase Init (ONLY ONCE) -->
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyBob43ZxNmd7TF8w88m1igpp_kmd3K4Hwo",
        authDomain: "crayfishmonitoring-30010.firebaseapp.com",
        projectId: "crayfishmonitoring-30010",
        storageBucket: "crayfishmonitoring-30010.firebasestorage.app",
        messagingSenderId: "974642532197",
        appId: "1:974642532197:web:77e52d4505e45275381b8c"
      };

      firebase.initializeApp(firebaseConfig);
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<header>
    <h1>🦞 Crayfish Monitoring Dashboard</h1>
</header>

<!-- CARDS -->
<div class="cards">

    <div class="card">
        <h3>Water Temperature</h3>
        <div class="value" id="temp">-- °C</div>
    </div>

    <div class="card">
        <h3>Food Level</h3>
        <div class="value" id="food">-- %</div>
    </div>

    <div class="card">
        <h3>Status</h3>
        <div class="value" id="status">--</div>
    </div>

</div>

<!-- CHARTS -->
<div class="chart">
    <h2>Water Temperature Trend</h2>
    <canvas id="tempChart"></canvas>
</div>

<div class="chart">
    <h2>Food Level Trend</h2>
    <canvas id="foodChart"></canvas>
</div>

<!-- LAST FEEDING INFO -->
<h2>Last Feeding: <span id="feedTime">--</span></h2>

<!-- SCRIPT -->
<script src="script.js"></script>

</body>
</html>
